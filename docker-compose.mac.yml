# Mac-local production override (tracked; NOT for NAS). Publishes app + postgres to the host
# and EXCLUDES cloudflared (no public tunnel — local-only). Use by naming services explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d --build migrate app worker postgres
# Reach the app at http://localhost:8787 ; host DB access (flip migrations) at localhost:5433
# (or :5544 — see the postgres ports note below).
services:
  app:
    # YUK-1404 — pin the container resolver to public recursive DNS. The Mac host runs a
    # fake-IP resolver (Surge/Clash-style): every A query is answered from 198.18.0.0/15,
    # and Docker's embedded DNS forwarder hands that down to the containers (TEST
    # evidence 2026-10-11: `getent www.jyeoo.com` → 198.18.12.228 in app+worker). The
    # image-candidate SSRF guard blocks that range BY DESIGN
    # (src/core/net/private-host.ts BLOCKED_IPV4_CIDRS), so every outbound source fetch
    # failed DNS-answer validation. Verified fix on the current app image in isolation:
    # `--dns 223.5.5.5 --dns 119.29.29.29` → node:dns.lookup returns public A answers for
    # www.jyeoo.com (receipt /tmp/yuk1404-public-dns-probe-01/). Never "fix" this by
    # allowing 198.18.0.0/15 anywhere — fix resolution instead.
    dns:
      - 223.5.5.5 # AliDNS
      - 119.29.29.29 # DNSPod
    ports:
      - "127.0.0.1:8787:8787"
    # All seven structural entities use canonical projection writers.
    # Rollback requires the previous release, not an environment-only flip.
    environment:
      # YUK-571 go-live state. Keep these non-secret flags in the tracked production
      # override: a deploy from a fresh/temp main checkout must not silently fall
      # back to the code defaults just because the local .env file was not copied.
      # NOTE compose `environment:` outranks env_file — .env can no longer toggle these.
      # Turn OFF = remove the line (or set "false") + recreate app/worker, same rollback
      # applies only to these product features. Keep values lowercase "true"
      # (placement parses case-sensitively; auto-enroll doesn't — don't "prettify").
      PLACEMENT_PROBE_ENABLED: "true"
      WORKFLOW_JUDGE_AUTO_ENROLL_ENABLED: "true"
      # YUK-1017 — conjecture-accept → misconception mint (soft track). Dark-ship code is
      # already live; this flag only makes accept mint when recurrence_count >= K_PROMOTE.
      # MISCONCEPTION_HARD_CONFIRM_ENABLED stays absent (ADR-0050 §(b2): no honest
      # target_error_match fact + fresh-owner-confirm requirement — structurally OFF).
      MISCONCEPTION_PROMOTE_ENABLED: "true"
      # Goal/learning_item/mistake_variant are canonical writers without mode switches.
      # item_calibration stays Scheme A / OFF.
  worker:
    # YUK-1404 — same public-DNS pin as app (see above). The worker owns the jyeoo
    # fetch subprocess and supply-plan execution, so its resolver must be real too.
    dns:
      - 223.5.5.5 # AliDNS
      - 119.29.29.29 # DNSPod
    environment:
      # Mirror app exactly; ingestion enrollment runs in the worker, while the
      # placement entrypoint runs in app. Repeating both makes process parity explicit.
      PLACEMENT_PROBE_ENABLED: "true"
      WORKFLOW_JUDGE_AUTO_ENROLL_ENABLED: "true"
      MISCONCEPTION_PROMOTE_ENABLED: "true"
  postgres:
    ports:
      # OrbStack's VM forwarder intermittently retains a stale reservation for
      # 5433 (process gone, `nc` connection-refused, yet `docker run` still
      # reports "address already in use", surviving an OrbStack restart). Keep
      # 5544 as the guaranteed-live host DB path; 5433 resumes working whenever
      # OrbStack releases its ghost bind. Host CLIs may use either.
      - "127.0.0.1:5433:5432"
      - "127.0.0.1:5544:5432"
