# Local OrbStack/Docker-Desktop overlay — overlays docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up app postgres -d
#
# Differences from prod compose:
#   - Postgres exposes 5433 on the host for manual access to this locally-run
#     compose stack. 5433 is TEST's historical relay port (closed 2026-11-06);
#     local pnpm scripts cannot use it — `pnpm db:migrate:local` and friends
#     default to the dev Postgres on :5434 (docker-compose.dev.yml), and the
#     shared guard in scripts/local-db-env.ts refuses loopback 5433/5544 (and
#     database `loom`) before connecting, on both the resolved-target and the
#     raw-DATABASE_URL entries. Reach THIS stack's DB via `docker compose exec`,
#     or set DEV_ALLOW_TEST_DB=1 explicitly.
#   - cloudflared is gated behind a "production" profile so `docker compose up`
#     does NOT try to start the tunnel locally (no TUNNEL_TOKEN required).

services:
  postgres:
    ports:
      - "5433:5432"

  app:
    ports:
      - "3000:3000"

  cloudflared:
    profiles: ["production"]
