name: Buildkite CI image

# YUK-917 Buildkite Green Bridge Phase 2 - build and push the pinned custom CI
# image (.buildkite/ci-image) for the linux-large queue to GHCR. Runs only on
# the migration branch (and manual dispatch) so the image evolves with the
# scaffold that consumes it. Uses ONLY the ephemeral GITHUB_TOKEN
# (contents: read, packages: write) - no deploy or production credentials -
# and deploys nothing: the pushed digest is emitted as a job summary and an
# artifact, and the lead records it in .buildkite/pins.env
# (CI_IMAGE_STATE=image_digest_published + CI_IMAGE_DIGEST + CI_IMAGE_PUBLISHED_AT)
# before any required/cutover use. Pins validation rejects a claimed digest
# while the state is image_digest_pending_publication.

on:
  push:
    branches: [codex/yuk-916-ci-buildkite-shadow]
    paths:
      - .buildkite/ci-image/**
      - .buildkite/pins.env
      - .github/workflows/buildkite-ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/buildkite-ci

jobs:
  build-push:
    name: build and push pinned CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: image
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${REGISTRY}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Build and push CI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .buildkite/ci-image
          file: .buildkite/ci-image/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.ref }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.ref }}:pw-1.62.1
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Emit digest artifact and summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          ref="${IMAGE_REF}@${DIGEST}"
          {
            echo "### Buildkite CI image published"
            echo ""
            echo "- Image: \`${ref}\`"
            echo "- Built from commit \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "Record in \`.buildkite/pins.env\` (then update CI_IMAGE_STATE):"
            echo '```'
            echo "CI_IMAGE_STATE=image_digest_published"
            echo "CI_IMAGE_DIGEST=${DIGEST}"
            echo "CI_IMAGE_PUBLISHED_AT=$(date -u +%F)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${ref}" > ci-image-digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-digest
          path: ci-image-digest.txt
          if-no-files-found: error
