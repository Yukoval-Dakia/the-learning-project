      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.db_changed != 'false'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.db_changed != 'false'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.filter.outputs.db_changed != 'false'
        run: pnpm install --frozen-lockfile
      - name: Run retained db invariants
        if: steps.filter.outputs.db_changed != 'false'
        env:
          TLP_SESSION_EVIDENCE_PATH: .cache/ci-profile/session
          TLP_REVIEW_EVIDENCE_PATH: .cache/ci-profile/review-migration.json
        run: |
          mkdir -p .cache/ci-profile
          pnpm test:db --shard=7/8 --reporter=default --reporter=json --outputFile.json=.cache/ci-profile/db-7.json
      - name: Save per-case DB timings
        if: always() && steps.filter.outputs.db_changed != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-case-timings-7
