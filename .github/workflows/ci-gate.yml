        run: node scripts/ci/gate-plan.mjs
      - name: Migration lane skipped
        if: steps.filter.outputs.migration_changed == 'false'
        run: echo "Migration lane not selected — lane is green."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.migration_changed != 'false'
