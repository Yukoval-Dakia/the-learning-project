name: CI Gate

# GitHub-only pre-merge gate. The heavyweight lanes run in parallel; the final `gate` job keeps
# the historical required-check name stable. DB tests use Testcontainers on GitHub-hosted runners.
# Docs-only changes still make every lane succeed without installing dependencies.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fail closed: an unknown/unreachable base runs the full gate rather than skipping it.
      - name: Detect docs-only change
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Base unknown — running the full gate."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! MB="$(git merge-base "$BASE" HEAD)"; then
            echo "Base '$BASE' is unreachable — running the full gate."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CHANGED="$(git diff --name-only "$MB" HEAD)"; then
            echo "Diff against '$MB' failed — running the full gate."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files vs $MB:"
          printf '%s\n' "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|\.remember/|.*\.md$)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: typecheck · lint · audits
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Docs-only — static lane skipped
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Docs-only change — static lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm typecheck
      - name: Lint
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm lint
      # Keep this list equivalent to the standalone pre-PR audits plus the audit prefix of
      # `pnpm test`. The split test lanes below must not call the umbrella script again.
      - name: Audits
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          pnpm audit:schema
          pnpm audit:dependencies
          pnpm audit:partition
          pnpm audit:api-contracts
          pnpm audit:api-client
          pnpm audit:api-client-usage
          pnpm audit:capability-boundaries
          pnpm audit:profile
          pnpm audit:learner-copy
          pnpm audit:no-learning-styles
          pnpm audit:structured-judge
          pnpm audit:draft-status
          pnpm audit:draft-status-reads --strict
          pnpm audit:hub-sync-writers

  unit:
    name: unit tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Docs-only — unit lane skipped
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Docs-only change — unit lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm test:unit

  db:
    name: DB tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docs-only — DB lane skipped
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Docs-only change — DB lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: DB tests
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm test:db

  migration:
    name: migration smoke
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Docs-only — migration lane skipped
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Docs-only change — migration lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Migration smoke
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm test:migration

  build:
    name: production build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Docs-only — build lane skipped
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Docs-only change — build lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build server, worker, migrate, and web
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm build
        env:
          DATABASE_URL: postgres://placeholder

  usability:
    name: usability container (shipped SPA + API fixtures)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Docs-only — usability lane skipped
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Docs-only change — usability lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm test:usability:install
      - name: Build shipped SPA and server
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm build
        env:
          DATABASE_URL: postgres://placeholder
      - name: Boot the built server on :18787
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          set -euo pipefail
          RW_STATIC_DIR=web/dist \
          API_PORT=18787 \
          INTERNAL_TOKEN=usability-ci-token \
          DATABASE_URL=postgres://placeholder:placeholder@127.0.0.1:1/placeholder \
          node dist/server.cjs > usability-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::server process ${SERVER_PID} exited before becoming healthy"
              cat usability-server.log
              exit 1
            fi
            if curl -sf http://127.0.0.1:18787/api/health > /dev/null; then
              echo "server healthy after ${i}s (pid ${SERVER_PID})"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server never became healthy on :18787"
          cat usability-server.log
          exit 1
      - name: Usability container regression
        if: needs.changes.outputs.code_changed == 'true'
        run: pnpm test:usability:container
        env:
          USABILITY_BASE_URL: http://127.0.0.1:18787
      - name: Server log (on failure)
        if: failure() && needs.changes.outputs.code_changed == 'true'
        run: cat usability-server.log || true
      - name: Upload Playwright traces (on failure)
        if: failure() && needs.changes.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: usability-traces
          path: test-results/usability
          if-no-files-found: ignore

  # Keep this name identical to the historical required check while the work moves into parallel jobs.
  gate:
    name: typecheck · lint · audits · test · build
    if: always()
    needs: [changes, static, unit, db, migration, build, usability]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          DB_RESULT: ${{ needs.db.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          USABILITY_RESULT: ${{ needs.usability.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in CHANGES STATIC UNIT DB MIGRATION BUILD USABILITY; do
            result_var="${lane}_RESULT"
            result="${!result_var}"
            printf '%-12s %s\n' "$lane" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required CI lanes did not succeed."
            exit 1
          fi
