name: CI Gate

# GitHub-only pre-merge gate. The heavyweight lanes run in parallel; the final `gate` job keeps
# the historical required-check name stable. DB tests use Testcontainers on GitHub-hosted runners.
# Docs-only changes still make every lane succeed without installing dependencies.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      static_changed: ${{ steps.filter.outputs.static_changed }}
      unit_changed: ${{ steps.filter.outputs.unit_changed }}
      db_changed: ${{ steps.filter.outputs.db_changed }}
      migration_changed: ${{ steps.filter.outputs.migration_changed }}
      build_changed: ${{ steps.filter.outputs.build_changed }}
      usability_changed: ${{ steps.filter.outputs.usability_changed }}
      unit_selection: ${{ steps.filter.outputs.unit_selection }}
      db_selection: ${{ steps.filter.outputs.db_selection }}
      merge_base: ${{ steps.filter.outputs.merge_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      # Fail closed: unknown paths/bases and main pushes run the full gate. Pull requests use
      # lane-level classification and the backfill-validated affected unit selector.
      - name: Plan incremental gate
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/gate-plan.mjs

  static:
    name: typecheck · lint · audits
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Static lane skipped
        if: needs.changes.outputs.static_changed != 'true'
        run: echo "Static lane not selected — lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.static_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.static_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.static_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.static_changed == 'true'
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        if: needs.changes.outputs.static_changed == 'true'
        run: pnpm install --frozen-lockfile
      # TypeScript validates every cached file fingerprint before reusing semantic state.
      # Key compiler/config separately, then restore the newest compatible commit as the
      # incremental base instead of rebuilding the ~1.3 MB graph on every static lane.
      - name: Restore TypeScript incremental state
        if: needs.changes.outputs.static_changed == 'true'
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: ts7-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ts7-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
      - name: Typecheck
        if: needs.changes.outputs.static_changed == 'true'
        run: pnpm typecheck
      - name: Lint
        if: needs.changes.outputs.static_changed == 'true'
        run: pnpm lint
      - name: OpenCode worktree plugin
        if: needs.changes.outputs.static_changed == 'true'
        run: pnpm test:opencode-worktree
      # Keep this list equivalent to the standalone pre-PR audits plus the audit prefix of
      # `pnpm test`. The split test lanes below must not call the umbrella script again.
      - name: Audits
        if: needs.changes.outputs.static_changed == 'true'
        run: |
          pnpm audit:schema
          pnpm audit:dependencies
          pnpm audit:partition
          pnpm audit:api-contracts
          pnpm audit:api-client
          pnpm audit:api-client-usage
          pnpm audit:capability-boundaries
          pnpm audit:profile
          pnpm audit:learner-copy
          pnpm audit:no-learning-styles
          pnpm audit:structured-judge
          pnpm audit:draft-status
          pnpm audit:draft-status-reads --strict
          pnpm audit:hub-sync-writers

  unit:
    name: unit tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Unit lane skipped
        if: needs.changes.outputs.unit_changed != 'true'
        run: echo "Unit lane not selected — lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.unit_changed == 'true'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.unit_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.unit_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.unit_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Select required unit tests
        id: unit_select
        if: needs.changes.outputs.unit_changed == 'true'
        continue-on-error: true
        env:
          UNIT_SELECTION_BASE: ${{ needs.changes.outputs.merge_base }}
          UNIT_SELECTION_MODE: ${{ needs.changes.outputs.unit_selection }}
        run: |
          mkdir -p .cache/ci
          node scripts/ci/unit-shadow.mjs select \
            --base "$UNIT_SELECTION_BASE" \
            --mode "$UNIT_SELECTION_MODE" \
            --output .cache/ci/unit-selection.json
      - name: Warn on selector process failure
        if: steps.unit_select.outcome == 'failure'
        run: echo "::warning title=Unit selector failed::Falling back to the full unit suite; investigate the selector process failure."
      - name: Unit tests (affected on PR, full on canary/fallback)
        if: needs.changes.outputs.unit_changed == 'true'
        run: |
          node scripts/ci/unit-shadow.mjs run \
            --selection .cache/ci/unit-selection.json \
            --results .cache/ci/unit-results.json \
            --execution .cache/ci/unit-execution.json
      - name: Upload unit selector report
        if: always() && needs.changes.outputs.unit_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-selector-report
          path: |
            .cache/ci/unit-selection.json
            .cache/ci/unit-execution.json
          if-no-files-found: warn

  db_selection:
    name: select DB tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DB selection skipped
        if: needs.changes.outputs.db_changed != 'true'
        run: echo "DB lane not selected — selector is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.db_changed == 'true'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.db_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.db_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.db_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Select DB tests once for every shard
        id: db_select
        if: needs.changes.outputs.db_changed == 'true'
        continue-on-error: true
        env:
          DB_SELECTION_BASE: ${{ needs.changes.outputs.merge_base }}
          DB_SELECTION_MODE: ${{ needs.changes.outputs.db_selection }}
        run: |
          mkdir -p .cache/ci
          node scripts/ci/db-affected.mjs select \
            --base "$DB_SELECTION_BASE" \
            --mode "$DB_SELECTION_MODE" \
            --output .cache/ci/db-selection.json
      - name: Warn on DB selector process failure
        if: steps.db_select.outcome == 'failure'
        run: echo "::warning title=DB selector failed::Falling back to the full DB suite; investigate the selector process failure."
      - name: Materialize shared full fallback
        if: steps.db_select.outcome == 'failure'
        env:
          DB_SELECTION_BASE: ${{ needs.changes.outputs.merge_base }}
        run: |
          node scripts/ci/db-affected.mjs select \
            --base "$DB_SELECTION_BASE" \
            --mode full \
            --output .cache/ci/db-selection.json
      - name: Upload shared DB selection
        if: needs.changes.outputs.db_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-selector-selection
          path: .cache/ci/db-selection.json
          if-no-files-found: error

  db:
    name: DB tests (${{ matrix.shard }}/2)
    needs: [changes, db_selection]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: DB lane skipped
        if: needs.changes.outputs.db_changed != 'true'
        run: echo "DB lane not selected — lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.db_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.db_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.db_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.db_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Download shared DB selection
        if: needs.changes.outputs.db_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: db-selector-selection
          path: .cache/ci
      - name: DB tests (affected on PR, full on canary/fallback)
        if: needs.changes.outputs.db_changed == 'true'
        run: |
          node scripts/ci/db-affected.mjs run \
            --selection .cache/ci/db-selection.json \
            --shard "${{ matrix.shard }}/2" \
            --execution ".cache/ci/db-execution-${{ matrix.shard }}.json"
      - name: Upload DB selector report
        if: always() && needs.changes.outputs.db_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-selector-report-shard-${{ matrix.shard }}
          path: |
            .cache/ci/db-selection.json
            .cache/ci/db-execution-${{ matrix.shard }}.json
          if-no-files-found: warn

  migration:
    name: migration smoke
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Migration lane skipped
        if: needs.changes.outputs.migration_changed != 'true'
        run: echo "Migration lane not selected — lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.migration_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.migration_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.migration_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.migration_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Migration smoke
        if: needs.changes.outputs.migration_changed == 'true'
        run: pnpm test:migration

  build:
    name: production build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build lane skipped
        if: needs.changes.outputs.build_changed != 'true'
        run: echo "Build lane not selected — lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.build_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.build_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.build_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.build_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build server, worker, migrate, and web
        if: needs.changes.outputs.build_changed == 'true'
        run: pnpm build
        env:
          DATABASE_URL: postgres://placeholder

  usability:
    name: usability container (shipped SPA + API fixtures)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Usability lane skipped
        if: needs.changes.outputs.usability_changed != 'true'
        run: echo "Usability lane not selected — lane is green."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.usability_changed == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.usability_changed == 'true'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.usability_changed == 'true'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: needs.changes.outputs.usability_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        if: needs.changes.outputs.usability_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: needs.changes.outputs.usability_changed == 'true'
        run: pnpm test:usability:install
      - name: Build shipped SPA and server
        if: needs.changes.outputs.usability_changed == 'true'
        run: pnpm build
        env:
          DATABASE_URL: postgres://placeholder
      - name: Boot the built server on :18787
        if: needs.changes.outputs.usability_changed == 'true'
        run: |
          set -euo pipefail
          RW_STATIC_DIR=web/dist \
          API_PORT=18787 \
          INTERNAL_TOKEN=usability-ci-token \
          DATABASE_URL=postgres://placeholder:placeholder@127.0.0.1:1/placeholder \
          node dist/server.cjs > usability-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::server process ${SERVER_PID} exited before becoming healthy"
              cat usability-server.log
              exit 1
            fi
            if curl -sf http://127.0.0.1:18787/api/health > /dev/null; then
              echo "server healthy after ${i}s (pid ${SERVER_PID})"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server never became healthy on :18787"
          cat usability-server.log
          exit 1
      - name: Usability container regression
        if: needs.changes.outputs.usability_changed == 'true'
        run: pnpm test:usability:container
        env:
          USABILITY_BASE_URL: http://127.0.0.1:18787
      - name: Server log (on failure)
        if: failure() && needs.changes.outputs.usability_changed == 'true'
        run: cat usability-server.log || true
      - name: Upload Playwright traces (on failure)
        if: failure() && needs.changes.outputs.usability_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: usability-traces
          path: test-results/usability
          if-no-files-found: ignore

  # Keep this name identical to the historical required check while the work moves into parallel jobs.
  gate:
    name: typecheck · lint · audits · test · build
    if: always()
    needs: [changes, static, unit, db_selection, db, migration, build, usability]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          DB_SELECTION_RESULT: ${{ needs.db_selection.result }}
          DB_RESULT: ${{ needs.db.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          USABILITY_RESULT: ${{ needs.usability.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in CHANGES STATIC UNIT DB_SELECTION DB MIGRATION BUILD USABILITY; do
            result_var="${lane}_RESULT"
            result="${!result_var}"
            printf '%-12s %s\n' "$lane" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required CI lanes did not succeed."
            exit 1
          fi
