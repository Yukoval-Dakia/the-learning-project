      - name: Build with injected secrets and verify security boundaries
        if: steps.filter.outputs.build_changed != 'false'
        run: pnpm acceptance:start-frontdoor --build
        env:
          DATABASE_URL: postgres://placeholder

  # TS↔Rust grading parity (YUK-1403). Every code change selects this lane; missing
  # native/WASM artifacts fail the suites instead of skipping them.
  parity:
    name: Rust numerics · native/WASM/JS parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan core gate
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/gate-plan.mjs
      - name: Parity lane skipped
        if: steps.filter.outputs.parity_changed == 'false'
        run: echo "No parity-relevant change — lane is green."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.parity_changed != 'false'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.parity_changed != 'false'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      # CircleCI's GHA machine image can inherit root-owned /usr/local Rust homes.
      # Keep installs and Cargo cache writes owned by this job's unprivileged user.
      - name: Prepare writable Rust homes
        if: steps.filter.outputs.parity_changed != 'false'
        shell: bash
        run: |
          set -euo pipefail
          id
          for directory in "${RUSTUP_HOME:-$HOME/.rustup}" "${CARGO_HOME:-$HOME/.cargo}"; do
            if [ -e "$directory" ]; then
              stat -c '%U:%G %a %n' "$directory"
            fi
          done
          rustup_home="$RUNNER_TEMP/parity-rustup"
          cargo_home="$RUNNER_TEMP/parity-cargo"
          mkdir -p "$rustup_home" "$cargo_home"
          test -w "$rustup_home" && test -w "$cargo_home"
          echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
          stat -c '%U:%G %a %n' "$rustup_home" "$cargo_home"
      # stable @ 2026-07-20; pin third-party actions to immutable commits.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.filter.outputs.parity_changed != 'false'
        with:
          targets: wasm32-wasip1-threads
      # v2 @ 2026-07-20. Cache Cargo registry/git data and this standalone crate's target.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.filter.outputs.parity_changed != 'false'
        with:
          workspaces: crates/calibration-native -> target
      - name: Install dependencies
        if: steps.filter.outputs.parity_changed != 'false'
        run: pnpm install --frozen-lockfile
      - name: Rust numerical invariants
        if: steps.filter.outputs.parity_changed != 'false'
        run: cargo test --manifest-path crates/calibration-native/Cargo.toml
      - name: Build native addon
        if: steps.filter.outputs.parity_changed != 'false'
        run: pnpm build:native
      - name: Build release WASM addon
        if: steps.filter.outputs.parity_changed != 'false'
        run: pnpm build:native:wasm
      - name: Require artifacts and run parity suites
        if: steps.filter.outputs.parity_changed != 'false'
        env:
          REQUIRE_RUST_PARITY: '1'
        run: |
          test -f crates/calibration-native/calibration-native.node
          test -f crates/calibration-native/calibration-native.wasm32-wasi.wasm
          test -f crates/calibration-native/calibration-native.wasi.cjs
          pnpm exec vitest run --config vitest.unit.config.ts \
            src/server/calibration/native-parity.unit.test.ts \
            src/server/calibration/wasm-parity.unit.test.ts \
            src/core/poly-exp-parity.unit.test.ts \
            src/core/coldstart-solver-parity.unit.test.ts

  # Keep this name identical to the historical required check while the work moves into parallel jobs.
  gate:
    name: typecheck · lint · audits · test · build
    if: always()
    needs:
      - static
      - audits_contracts
      - audits_architecture
      - audits_policy
      - unit_1
      - unit_2
      - db_1
      - db_2
      - db_3
      - db_4
      - db_5
      - db_6
      - db_7
      - db_8
      - migration
      - build
      - parity

    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          AUDITS_CONTRACTS_RESULT: ${{ needs.audits_contracts.result }}
          AUDITS_ARCHITECTURE_RESULT: ${{ needs.audits_architecture.result }}
          AUDITS_POLICY_RESULT: ${{ needs.audits_policy.result }}
          UNIT_1_RESULT: ${{ needs.unit_1.result }}
          UNIT_2_RESULT: ${{ needs.unit_2.result }}
          DB_1_RESULT: ${{ needs.db_1.result }}
          DB_2_RESULT: ${{ needs.db_2.result }}
          DB_3_RESULT: ${{ needs.db_3.result }}
          DB_4_RESULT: ${{ needs.db_4.result }}
          DB_5_RESULT: ${{ needs.db_5.result }}
          DB_6_RESULT: ${{ needs.db_6.result }}
          DB_7_RESULT: ${{ needs.db_7.result }}
          DB_8_RESULT: ${{ needs.db_8.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PARITY_RESULT: ${{ needs.parity.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in STATIC AUDITS_CONTRACTS AUDITS_ARCHITECTURE AUDITS_POLICY UNIT_1 UNIT_2 DB_1 DB_2 DB_3 DB_4 DB_5 DB_6 DB_7 DB_8 MIGRATION BUILD PARITY; do
            result_var="${lane}_RESULT"
            result="${!result_var}"
            printf '%-22s %s\n' "$lane" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required CI lanes did not succeed."
            exit 1
          fi
