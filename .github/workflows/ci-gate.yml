name: CI Gate

# Shared GitHub/CircleCI pre-merge gate. The heavyweight lanes run in parallel; the final `gate` job keeps
# the historical required-check name stable. DB tests use Testcontainers on GitHub-hosted runners.
# Each lane plans locally, so setup no longer waits for a separate classifier job.
# Verified docs-only changes still succeed without installing dependencies.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_policy_base:
        description: Commit SHA to compare test case admission
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan core gate
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/gate-plan.mjs
      - name: Static lane skipped
        if: steps.filter.outputs.static_changed == 'false'
        run: echo "Static lane not selected — lane is green."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.static_changed != 'false'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.static_changed != 'false'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.filter.outputs.static_changed != 'false'
        run: pnpm install --frozen-lockfile
      # TypeScript validates every cached file fingerprint before reusing semantic state.
      # Key compiler/config separately, then restore the newest compatible commit as the
      # incremental base instead of rebuilding the ~1.3 MB graph on every static lane.
      - name: Restore TypeScript incremental state
        if: steps.filter.outputs.static_changed != 'false'
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: ts7-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ts7-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
      - name: Typecheck
        if: steps.filter.outputs.static_changed != 'false'
        run: pnpm typecheck
      # YUK-909 — warning-count ratchet at the Biome 2 baseline: warning/info totals
      # may only decrease. Lower the baseline after a fixing batch: pnpm lint:ratchet:update
      - name: Lint and warning ratchet
        if: steps.filter.outputs.static_changed != 'false'
        run: node scripts/ci/lint-ratchet.mjs
  # YUK-1612: CircleCI GHA matrix instances share result filenames, and include-only
  # audit matrices do not fan out there. Static IDs keep every result distinct.
  audits_contracts:
    name: audits (contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan core gate
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/gate-plan.mjs
      - name: Audit lane skipped
        if: steps.filter.outputs.static_changed == 'false'
        run: echo "Audit lane not selected — lane is green."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.static_changed != 'false'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.static_changed != 'false'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.filter.outputs.static_changed != 'false'
        run: pnpm install --frozen-lockfile
      # Audits mirror the standalone pre-PR audits plus the audit prefix of `pnpm test`.
      # The split test lanes below must not call the umbrella script again.
      - name: Audits
        if: steps.filter.outputs.static_changed != 'false'
        env:
          TEST_POLICY_BASE: ${{ inputs.test_policy_base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm audit:schema
          pnpm audit:dependencies
          pnpm audit:partition
          pnpm audit:question-writers
          pnpm audit:api-contracts
          pnpm audit:api-client
          pnpm audit:api-client-usage
          pnpm audit:tool-params

  audits_architecture:
    name: audits (architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan core gate
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/gate-plan.mjs
      - name: Audit lane skipped
        if: steps.filter.outputs.static_changed == 'false'
        run: echo "Audit lane not selected — lane is green."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.static_changed != 'false'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.static_changed != 'false'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Resolve Circle audit comparison base
        id: circle_base
        if: steps.filter.outputs.static_changed != 'false'
        env:
          GH_READ_TOKEN: ${{ github.token }}
          BUILD_HEAD: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_EVENT: ${{ github.event_name }}
          PROVIDED_BEFORE: ${{ github.event.before }}
        run: node scripts/ci/resolve-circle-audit-base.mjs
      - name: Install dependencies
        if: steps.filter.outputs.static_changed != 'false'
        run: pnpm install --frozen-lockfile
      # Audits mirror the standalone pre-PR audits plus the audit prefix of `pnpm test`.
      # The split test lanes below must not call the umbrella script again.
      - name: Audits
        if: steps.filter.outputs.static_changed != 'false'
        env:
          TEST_POLICY_BASE: ${{ inputs.test_policy_base || github.event.pull_request.base.sha || github.event.before }}
          CAPABILITY_BASE_SHA: ${{ steps.circle_base.outputs.base || inputs.test_policy_base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm audit:capability-boundaries
          pnpm audit:architecture-deepening
          pnpm audit:profile
          pnpm audit:learner-copy
          pnpm audit:no-learning-styles
          pnpm audit:structured-judge

  audits_policy:
    name: audits (policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan core gate
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/gate-plan.mjs
      - name: Audit lane skipped
        if: steps.filter.outputs.static_changed == 'false'
        run: echo "Audit lane not selected — lane is green."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.static_changed != 'false'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.static_changed != 'false'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Resolve Circle audit comparison base
        id: circle_base
        if: steps.filter.outputs.static_changed != 'false'
        env:
          GH_READ_TOKEN: ${{ github.token }}
          BUILD_HEAD: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_EVENT: ${{ github.event_name }}
          PROVIDED_BEFORE: ${{ github.event.before }}
        run: node scripts/ci/resolve-circle-audit-base.mjs
      - name: Install dependencies
        if: steps.filter.outputs.static_changed != 'false'
        run: pnpm install --frozen-lockfile
      # Audits mirror the standalone pre-PR audits plus the audit prefix of `pnpm test`.
      # The split test lanes below must not call the umbrella script again.
      - name: Audits
        if: steps.filter.outputs.static_changed != 'false'
        env:
          TEST_POLICY_BASE: ${{ steps.circle_base.outputs.base || inputs.test_policy_base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm audit:test-policy
          pnpm audit:task-census
          pnpm audit:draft-status
          pnpm audit:draft-status-reads --strict
          pnpm audit:flags --strict
          pnpm audit:hub-sync-writers
          pnpm audit:provider-attempt-truth
          pnpm audit:model-source
          pnpm audit:advisory-locks

  unit_1:
    name: unit invariant tests (1/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan core gate
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/gate-plan.mjs
      - name: unit lane skipped
        if: steps.filter.outputs.unit_changed == 'false'
        run: echo "Docs-only change; unit lane skipped."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.unit_changed != 'false'
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.unit_changed != 'false'
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.filter.outputs.unit_changed != 'false'
        run: pnpm install --frozen-lockfile
      - name: Run retained unit invariants
        if: steps.filter.outputs.unit_changed != 'false'
        run: |
          mkdir -p .cache/ci-profile
          pnpm test:unit --shard=1/2 --reporter=default --reporter=json --outputFile.json=.cache/ci-profile/unit-1.json
      - name: Save per-case unit timings
        if: always() && steps.filter.outputs.unit_changed != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-case-timings-1
          path: .cache/ci-profile/unit-1.json
          retention-days: 7
          if-no-files-found: ignore

